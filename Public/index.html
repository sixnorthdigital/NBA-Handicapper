<script>
var app=document.getElementById("app"),TODAY=new Date().toLocaleDateString("en-CA",{timeZone:"America/Toronto"});
function addDays(d,n){var x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function dayLabel(d){return d===TODAY?"Today":new Date(d+"T12:00:00Z").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"})}
function dayChips(cur,fn){var h='<div class="chips">';for(var i=0;i<5;i++){var d=addDays(TODAY,i);h+='<button class="tab'+(d===cur?" on":"")+'" onclick="'+fn+'(\''+d+'\')">'+dayLabel(d)+'</button>'}return h+'</div>'}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pr(p){return p==null?"–":(p>0?"+"+p:p)}
function pct(x){return Math.round(x*100)+"%"}
function gc(g){return !g||g==="–"?"":g[0]==="A"?"ok":g[0]==="B"||g[0]==="C"?"wr":"bad"}
function tm(iso){return new Date(iso).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/Toronto"})+" ET"}
function img(u,c){return u?'<img class="'+c+'" src="'+esc(u)+'" alt="" onerror="this.style.visibility=\'hidden\'">':""}
async function api(u){var r=await fetch(u),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
var LIVE_T=null,TAB="home";
// ---------- Celly shell: sheets, toasts, More menu, How it works ----------
function closeSheet(){var d=document.querySelector(".sheetbg");if(d)d.remove()}
function sheet(html){closeSheet();var d=document.createElement("div");d.className="sheetbg";d.onclick=function(e){if(e.target===d)d.remove()};d.innerHTML='<div class="sheet">'+html+'</div>';document.body.appendChild(d);return d}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function soonMsg(x){toast(x+" come with the move into Celly")}
function moreSheet(){var it=[["trends","Trends","Hot players and teams against the spread",'<path d="M3 12h4l3-8 4 16 3-8h4"/>'],["stats","Leaders","Scoring, rebounding, assists and more",'<path d="M3 18h18"/><path d="M3 18l2-11 5 5 2-7 2 7 5-5 2 11"/>'],["news","News","Injuries and lineup changes",'<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7 9h7M7 13h7M7 16h4"/>']];
  sheet('<div class="mrh"><b>More</b><button class="pkx" onclick="closeSheet()" aria-label="Close">✕</button></div>'+it.map(function(x){return'<button class="mri'+(TAB===x[0]?' on':'')+'" onclick="closeSheet();go(\''+x[0]+'\')"><span class="mic"><svg viewBox="0 0 24 24">'+x[3]+'</svg></span><span><b>'+x[1]+'</b><small>'+x[2]+'</small></span><i>›</i></button>'}).join(""))}
function howSheet(){sheet('<div class="mrh"><b>How the NBA model works</b><button class="pkx" onclick="closeSheet()" aria-label="Close">✕</button></div><div class="note" style="font-size:14px">'+
  '<p><b>Projected score:</b> each team’s points per 100 possessions against the other’s points allowed, at the pace both teams play.</p><p><b>Then adjusted for:</b> home court, rest and travel (back-to-backs, miles, time zones, altitude) and injuries (what missing players are worth).</p>'+
  '<p><b>Chances</b> for the moneyline, spread and total are blended 50/50 with the market. A <b>best bet</b> needs a positive edge and 52%+.</p><p><b>Record</b> saves every pick before tip-off and grades it after the final, so the model can be judged before it joins Celly.</p></div>')}

function navOn(t){TAB=t;document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)})}
function go(t){window.scrollTo(0,0);clearTimeout(LIVE_T);if(t==="home"){NDATE=TODAY;nbaList()}else if(t==="record")recordPage();else nbaSoon(t)}
// ---------- NBA ----------
var NDATE=TODAY,NM=null;
var NB_SOON={streaks:["NBA Streaks","Point, rebound and three streaks plus daily cheat sheets"],stats:["NBA Leaders","Scoring, rebounding, assists and more"],leaders:["NBA Props","Points, rebounds, assists, threes and combos"],trends:["NBA Trends","Hot players and teams against the spread"],news:["NBA News","Injuries and lineup changes"],parlay:["Parlay Checker",""],wheel:["The Flippin’ Wheel",""],admin:["Admin",""]};
function nbaSoon(t){navOn(t);var x=NB_SOON[t]||["",""],nhlOnly=false;
  app.innerHTML='<div class="card"><b>'+esc(x[0])+'</b><p class="note" style="margin-top:6px">'+(nhlOnly?'This tab is NHL only for now. Tap NHL at the top to use it.':esc(x[1])+' are coming in the next stage of the NBA build.')+'</p></div>'}
function nbDay(d){NDATE=d;nbaList()}
function nbSp(s){return s&&s.spread?(s.spread.point>0?"+":"")+s.spread.point+(s.spread.price!=null?" ("+pr(s.spread.price)+")":""):"–"}
function nbRow(t,s,sc){var ml=s&&s.ml!=null?s.ml:null;
  return'<div class="tr">'+img(t.logo,"lg")+'<div class="nm"><b>'+esc(t.name)+'</b><span class="rec">'+(t.record?esc(t.record)+' (W-L)':'')+'</span></div>'+
  (s?'<div class="od"><span class="pill'+(ml!=null&&ml<0?' fav':'')+'">'+pr(ml)+'</span><span class="pill">'+nbSp(s)+'</span></div>':'')+(sc!=null?'<span class="sc">'+sc+'</span>':'')+'</div>'}
function nbLive(L){return L.half?"Halftime":esc(L.detail||("Q"+L.period+" · "+L.clock))}
async function nbaList(){
  navOn('home');app.innerHTML=dayChips(NDATE,"nbDay")+'<div id="nl">Loading…</div>';
  try{
    var gs=await api("/api/nba/games?date="+NDATE),h="",el=document.getElementById("nl");if(!el)return;
    var fin=gs.filter(function(g){return g.state==="FINAL"}).length;
    gs=gs.filter(function(g){return g.state!=="FINAL"});
    if(!gs.length)h='<p class="mu">'+(fin?'All of this date’s games are final.':'No NBA games on this date.')+'</p>';
    gs.forEach(function(g){var o=g.odds,t=o&&o.total,L=g.live;
      h+='<button class="card game gc'+(L?' lv':'')+'" onclick="nbShow(\''+g.home.abbr+"','"+g.away.abbr+'\')"><div class="top">'+
      (L?'<span class="badge live">● LIVE</span><span class="mu"><b>'+nbLive(L)+'</b></span>':g.state==="PPD"?'<span class="badge">Postponed</span><span></span>':'<span class="badge">'+tm(g.start)+'</span><span class="mu">'+(o?esc(o.book):"Odds unavailable")+'</span>')+'</div>'+
      (g.note?'<div class="mu" style="font-size:12px;margin:-2px 0 2px">'+esc(g.note)+'</div>':'')+
      nbRow(g.away,o&&o.away,L?L.away:null)+nbRow(g.home,o&&o.home,L?L.home:null)+
      (t?'<div class="tot"><span>Total '+t.point+'</span><span>O '+pr(t.over)+' · U '+pr(t.under)+'</span></div>':'')+'</button>'});
    if(fin&&gs.length)h+='<p class="note">'+fin+' final game'+(fin>1?'s':'')+' hidden.</p>';
    h+='<p class="note">Lines from DraftKings via ESPN. Tap a game for the model, leans, lineups, injuries, rest and the 2-year head-to-head.</p>';
    el.innerHTML=h;
    clearTimeout(LIVE_T);if(gs.some(function(g){return g.live}))LIVE_T=setTimeout(function(){if(TAB==="home"&&document.getElementById("nl"))nbaList()},60000);
  }catch(e){var el2=document.getElementById("nl");if(el2)el2.innerHTML='<p class="bad">'+esc(e.message)+'</p>'}
}
async function nbShow(home,away){
  clearTimeout(LIVE_T);navOn('home');window.scrollTo(0,0);
  app.innerHTML='<button class="back" onclick="nbaList()">‹ All games</button><div id="nm">Loading matchup…</div>';
  try{NM=await api("/api/nba/matchup?home="+home+"&away="+away+"&date="+NDATE);if(document.getElementById("nm"))nbDraw()}
  catch(e){var el=document.getElementById("nm");if(el)el.innerHTML='<p class="bad">'+esc(e.message)+'</p>'}
}
function nbRk(x){return x&&x.rank?'<span class="mu"> ('+x.rank+(x.rank===1?'st':x.rank===2?'nd':x.rank===3?'rd':'th')+')</span>':''}
function nbG(g){return'<i class="g '+gc(g)+'">'+esc(g)+'</i>'}
// ---------- model sections on the matchup page ----------
function sg(x){return(x>0?"+":"")+x}
function ord(n){return n+(n%100>10&&n%100<14?"th":n%10===1?"st":n%10===2?"nd":n%10===3?"rd":"th")}
var STR={Strong:"ok",Moderate:"ok",Slight:"wr","Toss-up":"mu",Solid:"ok",Lean:"wr"};
function nbSig(a){return a&&a.length?'<ul class="sgl">'+a.map(function(x){return'<li><b class="'+(x.d>0?'ok':'bad')+'">'+(x.d>0?'＋':'－')+'</b>'+esc(x.t)+'</li>'}).join("")+'</ul>':''}
function nbModel(m){
  var md=m.model,g=m.game,H=g.home.abbr,A=g.away.abbr,o=g.odds,h="";if(!md)return'<p class="note bad">Model unavailable'+(m.modelErr?': '+esc(m.modelErr):'')+'.</p>';
  var mkSp=o&&o.home&&o.home.spread?o.home.spread.point:null,mkT=o&&o.total?o.total.point:null,ml=-md.margin;
  var fav=function(line){return line<0?H+" "+line:line>0?A+" "+(-line):"Pick’em"};
  h+='<h2>Celly model</h2><div class="card"><div class="tiles"><div><b>'+Math.round(md.away)+'</b><span>'+esc(A)+' projected</span></div><div><b>'+Math.round(md.home)+'</b><span>'+esc(H)+' projected</span></div></div>';
  var bb=md.bets||[],pw=bb.filter(function(b){return b.type==="ml"&&b.side==="home"})[0];
  h+='<div class="wrap"><table><tr><th></th><th>Model</th><th>Market</th></tr>'+
    '<tr><td class="mu">Spread</td><td><b>'+esc(fav(Math.round(ml*2)/2))+'</b></td><td>'+(mkSp!=null?esc(fav(mkSp)):'–')+'</td></tr>'+
    '<tr><td class="mu">Total</td><td><b>'+md.total+'</b></td><td>'+(mkT!=null?mkT:'–')+'</td></tr>'+
    (pw?'<tr><td class="mu">'+esc(H)+' win</td><td><b>'+pct(pw.model)+'</b></td><td>'+(pw.fair!=null?pct(pw.fair):'–')+'</td></tr>':'')+'</table></div>';
  var a=md.adj,R=md.rates;
  h+='<details style="margin-top:8px"><summary class="lnk" style="cursor:pointer">How the projection is built</summary><div class="note">'+
    '<p>Offense vs defense: each team’s points per 100 possessions against the other’s points allowed per 100, at the pace both teams play ('+md.poss+' possessions) → '+esc(A)+' '+a.base.away+', '+esc(H)+' '+a.base.home+'.</p>'+
    '<p>Home court '+(a.hca?'+'+a.hca+' to '+esc(H)+' (split across both scores)':'none (neutral site)')+'. Rest and travel '+(a.rest?sg(a.rest)+' to '+esc(a.rest>0?H:A):'even')+'. '+
    'Injuries: '+esc(H)+' missing '+a.injHome+' pts, '+esc(A)+' missing '+a.injAway+' pts of value (60% comes off their own score, 40% goes to the opponent).</p>'+
    '<p>Early in the season last season still counts: '+esc(A)+' '+Math.round(R.away.prevW*100)+'%, '+esc(H)+' '+Math.round(R.home.prevW*100)+'% (fades as games are played). Chances use a spread of ±'+md.sd.margin+' pts on the margin and ±'+md.sd.total+' on the total, then are blended 50/50 with the market’s no-vig price.</p>'+
    '<p>League so far: '+md.league.rtg+' pts per 100, pace '+md.league.pace+' ('+md.league.games+' games'+(md.league.ready?'':', still loading')+').</p></div></details></div>';
  // leans
  var L=md.lean,lrow=function(t,x,txt){return x?'<div style="padding:8px 0;border-top:1px solid var(--bd)"><div style="display:flex;justify-content:space-between;gap:8px"><span class="mu">'+t+'</span><b class="'+(STR[x.strength]||'')+'">'+esc(x.strength)+'</b></div><b>'+txt+'</b> <span class="mu">'+pct(x.p)+(x.underdog?' · underdog':'')+'</span>'+nbSig(x.signals)+'</div>':''};
  h+='<h2>Leans</h2><div class="card">'+(md.best?'<div style="padding-bottom:8px"><span class="mu">Best bet</span><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-size:16px">'+esc(md.best.label)+' '+pr(md.best.price)+'</b><b class="'+(STR[md.best.strength]||'')+'">'+md.best.strength+'</b></div><span class="mu">'+pct(md.best.p)+' to hit vs '+pct(1/(md.best.price>0?1+md.best.price/100:1+100/-md.best.price))+' implied · edge '+sg(Math.round(md.best.edge*1000)/10)+'%</span></div>':'<p class="mu" style="margin:0 0 8px">No bet clears the bar (positive edge, 52%+, not shorter than −250).</p>')+
    lrow("Winner",L.winner,esc(L.winner.abbr)+' to win')+lrow("Spread",L.spread,L.spread?esc(L.spread.abbr)+' '+sg(L.spread.point)+' <span class="mu">(model '+esc(fav(Math.round(L.spread.modelLine*2)/2))+')</span>':'')+
    lrow("Total",L.total,L.total?(L.total.pick==="over"?"Over ":"Under ")+L.total.line+' <span class="mu">(model '+L.total.xTotal+')</span>':'')+
    '<p class="note">Leans are what the data says before prices. Strength = how far from a coin flip, plus 2 points for each signal that agrees (minus for each that disagrees). For testing: not betting advice.</p></div>';
  return h;
}
function nbOvd(m){
  var md=m.model,g=m.game;if(!md)return"";var A=md.rates.away,H=md.rates.home;
  var c=function(v,rk,n){return v==null?'–':v+(rk?' <span class="mu">('+ord(rk)+')</span>':'')};
  var row=function(l,a,b){return'<tr><td class="mu">'+l+'</td><td>'+a+'</td><td>'+b+'</td></tr>'};
  return'<h2>Offense vs defense</h2><div class="card"><div class="wrap"><table style="white-space:normal;table-layout:fixed"><tr><th style="width:34%"></th><th>'+esc(g.away.abbr)+'</th><th>'+esc(g.home.abbr)+'</th></tr>'+
    row("Offense <span class='mu'>pts/100</span>",c(A.ortg,A.rk.ortg),c(H.ortg,H.rk.ortg))+row("Defense <span class='mu'>allowed/100</span>",c(A.drtg,A.rk.drtg),c(H.drtg,H.rk.drtg))+
    row("Net rating",A.net!=null?c(sg(A.net),A.rk.net):'–',H.net!=null?c(sg(H.net),H.rk.net):'–')+row("Pace <span class='mu'>poss/48</span>",c(A.paceRaw,A.rk.pace),c(H.paceRaw,H.rk.pace))+
    row("Matchup",esc(g.away.abbr)+' O vs '+esc(g.home.abbr)+' D: <b>'+(A.rk.ortg&&H.rk.drtg?(A.rk.ortg+H.rk.drtg<=31?'edge O':'edge D'):'–')+'</b>',esc(g.home.abbr)+' O vs '+esc(g.away.abbr)+' D: <b>'+(H.rk.ortg&&A.rk.drtg?(H.rk.ortg+A.rk.drtg<=31?'edge O':'edge D'):'–')+'</b>')+
    '</table></div><p class="note">Per-100-possession ratings from this season’s box scores (1st = best; for defense, fewest allowed). '+A.n+' and '+H.n+' games so far.</p></div>'}
function nbRest(m){
  var s=m.sched,g=m.game;if(!s)return"";
  var one=function(t,x){return'<div class="pcd" style="cursor:default"><div style="display:flex;justify-content:space-between"><b>'+esc(t.abbr)+'</b><i class="g '+gc(x.grade)+'">'+x.grade+'</i></div><ul class="sgl">'+x.notes.map(function(n){return'<li>'+esc(n)+'</li>'}).join("")+'</ul></div>'};
  return'<h2>Rest &amp; travel</h2><div class="card"><div class="pr">'+one(g.away,s.away)+one(g.home,s.home)+'</div>'+
    (s.edge?'<p class="note"><b class="ok">Edge '+esc(s.edge.team)+'</b>: '+esc(s.edge.tired)+' is '+(s.edge.size==="notable"?'much ':'')+'more tired, worth about '+s.edge.pts+' pts in the model.</p>':'<p class="note">No real rest or travel edge.</p>')+'</div>'}
function nbP(p){if(!p)return'<div class="pcd"></div>';var t=p.inj?'<span class="ib">'+esc((p.injLabel||p.inj).toUpperCase())+'</span>':'';
  return'<div class="pcd'+(p.inj?' inj':'')+'" style="cursor:default'+(p.out?';opacity:.65':'')+'"><div class="pn"><b'+(p.out?' style="text-decoration:line-through"':'')+'>'+esc(ab(p.name))+'</b><span class="mu">'+esc(p.pos||"")+(p.sub?' · in for '+esc(ab(p.for)):'')+t+'</span></div>'+
  '<div class="st"><span>MIN <b>'+p.min+'</b></span><span>PTS <b>'+p.pts+'</b></span><span>REB <b>'+p.reb+'</b></span><span>AST <b>'+p.ast+'</b></span></div>'+(p.injNote?'<div class="gn bad">'+esc(p.injNote.length>80?p.injNote.slice(0,80)+'…':p.injNote)+'</div>':'')+'</div>'}
function ab(n){return String(n||"").replace(/^(\S)\S*\s+/,"$1. ")}
function nbLineups(m){
  var L=m.lineups,g=m.game;if(!L)return"";
  var col=function(x){return(x||[]).filter(function(p){return!p.out})},gone=function(x){return(x||[]).filter(function(p){return p.out})};
  var A=col(L.away.starters),H=col(L.home.starters),oA=gone(L.away.starters),oH=gone(L.home.starters),n=Math.max(A.length,H.length),h='<h2>Projected lineups</h2><div class="card"><div class="cols"><div class="ch">'+img(g.away.logo,"lg")+esc(g.away.abbr)+'</div><div class="ch">'+img(g.home.logo,"lg")+esc(g.home.abbr)+'</div></div>';
  h+='<div class="pos"><span>Starters</span></div>';for(var i=0;i<n;i++)h+='<div class="pr" style="margin-bottom:8px">'+nbP(A[i])+nbP(H[i])+'</div>';
  var no=Math.max(oA.length,oH.length);if(no){h+='<div class="pos"><span>Usual starters out</span></div>';for(var q=0;q<no;q++)h+='<div class="pr" style="margin-bottom:8px">'+nbP(oA[q])+nbP(oH[q])+'</div>'}
  var bA=L.away.bench||[],bH=L.home.bench||[],k=Math.max(bA.length,bH.length);
  if(k){h+='<div class="pos"><span>Bench</span></div>';for(var j=0;j<k;j++)h+='<div class="pr" style="margin-bottom:8px">'+nbP(bA[j])+nbP(bH[j])+'</div>'}
  var lg=function(t,x){return x?esc(t)+' from '+(x.home?'vs ':'@ ')+esc(x.opp)+(x.date?' on '+new Date(x.date+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"}):'')+(x.thisSeason?'':' (last season)'):''};
  return h+'<p class="note">Starters = each team’s starting five last game ('+lg(g.away.abbr,L.away.last)+'; '+lg(g.home.abbr,L.home.last)+'). Anyone out or doubtful is crossed out and replaced by the next man up at his position. Red box = on the injury report. Averages are this season (end of last season early on).</p></div>'}
function nbInj(m){
  var I=m.injuries,g=m.game;if(!I)return"";
  var one=function(t,x){return'<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b>'+esc(t.abbr)+'</b><span class="mu">'+(x.pts?'−'+x.pts+' pts':'no impact')+'</span></div>'+
    (x.rows.length?x.rows.map(function(r){return'<div class="nwx"><div><b>'+esc(r.name)+'</b> <span class="kd '+(r.key==="out"||r.key==="suspension"?'new':'status')+'">'+esc(r.status)+'</span><div class="mu" style="font-size:12px">'+esc(r.detail||'')+(r.ret?' · est. return '+esc(String(r.ret).slice(0,10)):'')+'</div></div><span>'+(r.min!=null?r.pts+' ppg · '+r.min+' min<br>':'')+'<b>'+(r.cost?'−'+r.cost:'0')+'</b> pts'+(r.share!=null&&r.share<1?'<br><span style="font-size:11px">'+Math.round((1-r.share)*100)+'% already priced in</span>':'')+'</span></div>'}).join(""):'<p class="mu" style="margin:4px 0">Nobody listed.</p>')+'</div>'};
  return'<h2>Injuries</h2><div class="card">'+(I.ok?one(g.away,I.away)+one(g.home,I.home):'<p class="mu">Injury report unavailable right now.</p>')+
    '<p class="note">From the ESPN injury report. Cost = what the player is worth over a replacement in his minutes × chance he sits (Out 100%, Doubtful 80%, Questionable 45%, Day-to-day 30%). Games he has already missed are in the team’s numbers, so that part isn’t counted twice.</p></div>'}
function nbDraw(){
  var m=NM,g=m.game,o=g.odds,T=m.teams,A=T.away,H=T.home,dt=new Date(g.start).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"America/Toronto"});
  var fav=o&&o.home.spread&&o.home.spread.point!=null?(o.home.spread.point<0?[g.home.abbr,o.home.spread.point]:o.home.spread.point>0?[g.away.abbr,-o.home.spread.point]:["Pick’em",""]):null;
  var h='<button class="back" onclick="nbaList()">‹ All games</button><div class="mh"><div class="sd">'+img(g.away.logo,"lg")+'<div><b>'+esc(g.away.abbr)+'</b><span class="mu">'+esc(g.away.record||"")+'</span></div></div>'+
    '<div class="md"><b>'+(g.live?'<span class="bad">● '+g.live.away+'–'+g.live.home+'</span>':dt)+'</b><span class="mu">'+(g.live?nbLive(g.live):tm(g.start))+'</span><span class="mu">'+(fav?esc(fav[0])+" "+fav[1]:"")+(m.marketTotal!=null?" · O/U "+m.marketTotal:"")+'</span></div>'+
    '<div class="sd r"><div><b>'+esc(g.home.abbr)+'</b><span class="mu">'+esc(g.home.record||"")+'</span></div>'+img(g.home.logo,"lg")+'</div></div>';
  // odds
  h+='<h2>Odds</h2><div class="card">'+(o?'<div class="wrap"><table><tr><th>Team</th><th>Moneyline</th><th>Spread</th></tr>'+
    [["away",g.away],["home",g.home]].map(function(x){var s=o[x[0]];return'<tr><td class="t">'+esc(x[1].abbr)+'</td><td>'+pr(s.ml)+'</td><td>'+nbSp(s)+'</td></tr>'}).join("")+
    (o.total?'<tr><td class="t">Total</td><td colspan="2">'+o.total.point+' · O '+pr(o.total.over)+' / U '+pr(o.total.under)+'</td></tr>':'')+'</table></div><p class="note">'+esc(o.book)+' lines via ESPN.</p>':'<p class="mu" style="margin:0">No lines posted yet.</p>')+'</div>';
  h+=nbModel(m)+nbOvd(m)+nbRest(m);
  // team comparison
  var row=function(l,a,b){return'<tr><td class="mu">'+l+'</td><td>'+a+'</td><td>'+b+'</td></tr>'};
  var rs=function(t){var r=t.rest||{};return r.b2b||r.threeInFour?'<span class="bad">'+esc(r.note)+'</span>':esc(r.note||"–")};
  h+='<h2>Team matchup</h2><div class="card"><div class="wrap"><table style="white-space:normal;table-layout:fixed"><tr><th style="width:30%"></th><th>'+esc(g.away.abbr)+' (away)</th><th>'+esc(g.home.abbr)+' (home)</th></tr>'+
    row("Overall grade",nbG(A.overallGrade),nbG(H.overallGrade))+row("Offense grade",nbG(A.offenseGrade),nbG(H.offenseGrade))+row("Defense grade",nbG(A.defenseGrade),nbG(H.defenseGrade))+
    row("Points / game",(A.pf.perGame!=null?A.pf.perGame:"–")+nbRk(A.pf),(H.pf.perGame!=null?H.pf.perGame:"–")+nbRk(H.pf))+
    row("Allowed / game",(A.pa.perGame!=null?A.pa.perGame:"–")+nbRk(A.pa),(H.pa.perGame!=null?H.pa.perGame:"–")+nbRk(H.pa))+
    row("Point diff",(A.net.perGame!=null?(A.net.perGame>0?"+":"")+A.net.perGame:"–")+nbRk(A.net),(H.net.perGame!=null?(H.net.perGame>0?"+":"")+H.net.perGame:"–")+nbRk(H.net))+
    row("Road / home",esc(A.road||"–")+' <span class="mu">road</span>',esc(H.home||"–")+' <span class="mu">home</span>')+
    row("Last 10",esc(A.l10)+(A.l10pf!=null?' <span class="mu">'+A.l10pf+'–'+A.l10pa+'</span>':''),esc(H.l10)+(H.l10pf!=null?' <span class="mu">'+H.l10pf+'–'+H.l10pa+'</span>':''))+
    row("Last 5",esc(A.last5),esc(H.last5))+row("Streak",esc(A.streak),esc(H.streak))+row("Rest",rs(A),rs(H))+'</table></div>';
  var pw=Math.max(A.prevW||0,H.prevW||0);
  h+='<p class="note">Grades rank each team’s scoring and defence against the league and against tonight’s opponent (A = top 4, F = bottom 4).'+
    (pw>0?' Early season: last season still counts up to '+Math.round(pw*100)+'% of the per-game numbers and fades out by game 20.':'')+
    (A.formFromLast||H.formFromLast?' Form includes the end of last season until a team has played 5 games.':'')+'</p></div>';
  h+=nbLineups(m)+nbInj(m);
  // head-to-head
  var S=m.h2hSum,hd=m.h2h;
  h+='<h2>Head-to-head · last 2 years</h2><div class="card">';
  if(!hd.length)h+='<p class="mu" style="margin:0">No meetings in the last 2 years.</p>';
  else{
    h+='<div class="sum"><span>'+esc(g.home.abbr)+' '+S.homeWins+'–'+S.awayWins+'</span><span>'+esc(g.home.abbr)+' ATS '+S.ats[0]+'–'+S.ats[1]+(S.ats[2]?'–'+S.ats[2]:'')+'</span><span>Over '+S.overs+' · Under '+S.unders+'</span>'+(S.avgTotal!=null?'<span>Avg total '+S.avgTotal+'</span>':'')+'</div>';
    h+='<div class="wrap"><table><tr><th>Date</th><th>Score</th><th>'+esc(g.home.abbr)+' ATS</th><th>Total</th>'+(m.marketTotal!=null?'<th>vs '+m.marketTotal+'</th>':'')+'</tr>'+
    hd.map(function(r){var aw=r.as>r.hs;
      return'<tr><td>'+new Date(r.date+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})+" ’"+r.date.slice(2,4)+(r.playoff?' <span class="tag">PO</span>':'')+'</td><td>'+(aw?'<b>':'')+esc(r.away)+' '+r.as+(aw?'</b>':'')+' @ '+(!aw?'<b>':'')+esc(r.home)+' '+r.hs+(!aw?'</b>':'')+'</td>'+
      '<td class="'+(r.ats==="W"?"ok":r.ats==="L"?"bad":"")+'">'+(r.ats?r.ats+' <span class="mu">('+(r.spread>0?"+":"")+r.spread+')</span>':'–')+'</td>'+
      '<td>'+r.total+(r.ou?' <span class="'+(r.ou==="Over"?"ok":r.ou==="Under"?"bad":"mu")+'">'+r.ou[0]+'</span> <span class="mu">'+r.close+'</span>':'')+'</td>'+
      (m.marketTotal!=null?'<td class="'+(r.vsToday==="Over"?"ok":r.vsToday==="Under"?"bad":"")+'">'+(r.vsToday||"–")+'</td>':'')+'</tr>'}).join("")+'</table></div>';
    h+='<p class="note">ATS is '+esc(g.home.abbr)+'’s result against that game’s closing spread (shown in brackets). Total shows O/U against that game’s closing total'+(m.marketTotal!=null?', and the last column against tonight’s line':'')+'. Bold = winner.</p>';
  }
  h+='</div><p class="note">Player props are the next stage.</p>';
  app.innerHTML=h;
}

// ---------- Record: how the picks have done (saved before tip-off by the tracker, graded from final scores) ----------
function rcU(u){return'<strong class="'+(u>0?'ok':u<0?'bad':'')+'">'+(u>0?'+':'')+u.toFixed(2)+'u</strong>'}
function rcWL(t){return t.w+'–'+t.l+(t.p?'–'+t.p:'')}
function rcTile(lbl,t){return'<div><b>'+(t.n?rcWL(t):'–')+'</b><span>'+lbl+'</span><span style="display:block;margin-top:2px">'+(t.n?rcU(t.units)+' · '+(t.roi>0?'+':'')+t.roi+'% ROI':'no results yet')+'</span></div>'}
var RC_R={win:['✓','ok'],loss:['✗','bad'],push:['P','mu']};
function rcPick(lbl,x,g){if(!x)return'';var r=g&&RC_R[g.r];
  return'<div class="nwx"><div><span class="mu" style="font-size:12px">'+lbl+(x.strength?' · '+esc(x.strength):'')+'</span><br><b>'+esc(x.label||(x.kind==="ml"?x.abbr+' ML':x.kind==="spread"?x.abbr+' '+(x.point>0?'+':'')+x.point:(x.pick==="over"?'Over ':'Under ')+x.line))+'</b> '+pr(x.price)+'</div><span>'+pct(x.p)+(r?'<br><b class="'+r[1]+'">'+r[0]+' '+(g.u>0?'+':'')+g.u.toFixed(2)+'u</b>':'<br><span class="mu">pending</span>')+'</span></div>'}
async function recordPage(){
  navOn('record');app.innerHTML='<div id="rc">Loading the record…</div>';
  try{var R=await api("/api/nba/record"),T=R.totals,h="",el=document.getElementById("rc");if(!el)return;
    h+='<div class="card"><b>NBA model record</b><p class="note" style="margin-top:4px">Every game’s picks are saved automatically before tip-off (latest lines), then graded from the final score. 1 unit flat on every pick. '+(R.updated?'Updated '+new Date(R.updated).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit",timeZone:"America/Toronto"})+' ET.':'The tracker hasn’t run yet.')+(R.pending?' '+R.pending+' game'+(R.pending>1?'s':'')+' pending.':'')+'</p></div>';
    h+='<h2>Best bets</h2><div class="tiles">'+rcTile("Best bets",T.best)+'</div><div class="tiles">'+rcTile("Moneyline",R.bestByType.ml)+rcTile("Spread",R.bestByType.spread)+rcTile("Total",R.bestByType.total)+'</div>';
    h+='<h2>Leans (every game)</h2><div class="tiles">'+rcTile("Winner",T.winner)+rcTile("Spread",T.spread)+rcTile("Total",T.total)+'</div>';
    if(R.underdogs.n)h+='<p class="note" style="margin-top:-2px">Underdog winner leans: '+rcWL(R.underdogs)+', '+rcU(R.underdogs.units)+'.</p>';
    var S=R.strength,rows="";["winner","spread","total"].forEach(function(k){["Strong","Moderate","Slight","Toss-up"].forEach(function(s){var t=S[k]&&S[k][s];if(t&&t.n)rows+='<tr><td>'+k[0].toUpperCase()+k.slice(1)+'</td><td>'+s+'</td><td>'+rcWL(t)+'</td><td>'+(t.hit!=null?t.hit+'%':'–')+'</td><td>'+rcU(t.units)+'</td></tr>'})});
    h+='<h2>By strength</h2><div class="card">'+(rows?'<div class="wrap"><table><tr><th>Lean</th><th>Strength</th><th>W–L</th><th>Hit</th><th>Units</th></tr>'+rows+'</table></div><p class="note">If the model works, Strong should beat Moderate, which should beat Slight.</p>':'<p class="mu" style="margin:0">No graded games yet.</p>')+'</div>';
    var A=R.accuracy;
    h+='<h2>Model vs market</h2><div class="card">'+(A.margin||A.total?'<div class="wrap"><table><tr><th>Average miss</th><th>Model</th><th>Market</th><th>Games</th></tr>'+
      (A.margin?'<tr><td>Final margin</td><td class="'+(A.margin.model<A.margin.market?'ok':'bad')+'">'+A.margin.model+' pts</td><td>'+A.margin.market+' pts</td><td>'+A.margin.n+'</td></tr>':'')+
      (A.total?'<tr><td>Final total</td><td class="'+(A.total.model<A.total.market?'ok':'bad')+'">'+A.total.model+' pts</td><td>'+A.total.market+' pts</td><td>'+A.total.n+'</td></tr>':'')+'</table></div><p class="note">How far the model’s projected margin and total were from the final score, next to the betting line. Getting close to the market is good; beating it over a few hundred games is the real test.</p>':'<p class="mu" style="margin:0">No graded games yet.</p>')+'</div>';
    h+='<h2>By day</h2>';
    if(!R.days.length)h+='<p class="mu">Nothing saved yet. The tracker saves picks from noon ET on game days.</p>';
    R.days.forEach(function(d,i){var u=0,w=0,l=0;d.games.forEach(function(g){var b=g.grades&&g.grades.best;if(b){u+=b.u;if(b.r==="win")w++;else if(b.r==="loss")l++}});
      h+='<details class="card"'+(i===0?' open':'')+'><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:8px"><b>'+dayLabel(d.date)+'</b><span class="mu">'+d.games.length+' game'+(d.games.length>1?'s':'')+(w+l?' · best bets '+w+'–'+l+' '+(u>0?'+':'')+u.toFixed(2)+'u':'')+'</span></summary>'+
      d.games.map(function(g){var s=g.snap,G=g.grades||{},R2=g.result;
        return'<div style="padding:8px 0;border-top:1px solid var(--bd);margin-top:8px"><div style="display:flex;justify-content:space-between"><b>'+esc(g.away)+' @ '+esc(g.home)+'</b><span class="mu">'+(R2&&!R2.void?esc(g.away)+' '+R2.as+' – '+R2.hs+' '+esc(g.home):R2&&R2.void?'Postponed':tm(g.start))+'</span></div>'+
        '<div class="mu" style="font-size:12px">Model '+esc(g.away)+' '+Math.round(s.model.away)+' – '+Math.round(s.model.home)+' '+esc(g.home)+' · total '+s.model.total+(s.odds.total!=null?' (line '+s.odds.total+')':'')+'</div>'+
        rcPick("Best bet",s.best,G.best)+rcPick("Winner",s.winner,G.winner)+rcPick("Spread",s.spread,G.spread)+rcPick("Total",s.total,G.total)+'</div>'}).join("")+'</details>'});
    el.innerHTML=h;
  }catch(e){var e2=document.getElementById("rc");if(e2)e2.innerHTML='<p class="bad">'+esc(e.message)+'</p>'}
}
go('home');
</script>
